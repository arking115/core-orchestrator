name: core-orchestrator

services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orchestrator"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orchestrator
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # Configure the remote “lab server” connection at deploy time
      SSH_HOST: ${SSH_HOST:-193.226.6.116}
      SSH_USERNAME: ${SSH_USERNAME:-infratest}
      SSH_KEY_PATH: /run/secrets/ssh_private_key

      STORAGE_BASE_PATH: ${STORAGE_BASE_PATH:-/home/infratest/lab-data}
      STORAGE_CONTAINER_PATH: ${STORAGE_CONTAINER_PATH:-/home/student}
    secrets:
      - ssh_private_key
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the frontend bundle at build time.
        # Used for the Student "ssh ..." command display.
        VITE_SSH_HOST: ${VITE_SSH_HOST:-${SSH_HOST}}
        VITE_SSH_USER: ${VITE_SSH_USER:-student}
    environment:
      PORT: "5173"
    depends_on:
      - backend

secrets:
  # Create this file on the host running Compose:
  #   ./secrets/id_rsa
  # and keep it OUT of git.
  ssh_private_key:
    file: ./secrets/id_rsa

volumes:
  postgres_data:

